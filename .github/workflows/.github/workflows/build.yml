name: Build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew || true
      - run: gradle remapJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gavdlc
          path: build/libs/*.jar
